name: Development checks

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: leo-study-web

jobs:
  checks:
    name: Node 22 checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: leo-study-web/package-lock.json

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Run unit and backend tests
        id: test
        run: npm test

      - name: Lint source
        id: lint
        run: npm run lint

      - name: Check TypeScript
        id: typecheck
        run: npx --no-install tsc -b

      - name: Compile application without service credentials
        id: build
        env:
          VITE_DISABLE_LIVE_INTEGRATIONS: 'true'
          VITE_SUPABASE_URL: ''
          VITE_SUPABASE_ANON_KEY: ''
        run: npm run build

      - name: Summarize checks
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TEST_RESULT: ${{ steps.test.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
        run: |
          {
            printf '### Development checks\n\n'
            printf '| Check | Result |\n| --- | --- |\n'
            printf '| Locked dependency install | %s |\n' "$INSTALL_RESULT"
            printf '| Unit and backend tests | %s |\n' "$TEST_RESULT"
            printf '| Lint | %s |\n' "$LINT_RESULT"
            printf '| TypeScript | %s |\n' "$TYPECHECK_RESULT"
            printf '| Application build | %s |\n\n' "$BUILD_RESULT"
            printf 'Validation only. This workflow does not deploy or publish artifacts, and uses no application secrets.\n'
          } >> "$GITHUB_STEP_SUMMARY"
