# Development origin only. The production proxy and Supabase stack are separate.
map $http_upgrade $dev_connection_upgrade {
  default upgrade;
  '' close;
}

# Public data requests use the exact queries emitted by the enrollment UI.
# Matching the entire URI also rejects extra/duplicate query parameters and
# nested PostgREST selections that could cross into private tables.
map "$request_method:$request_uri" $dev_public_rest {
  default 0;
  "~^GET:/supabase/rest/v1/academy_classes\?select=id%2Cclass_name%2Cstart_date%2Cend_date%2Cstatus%2Cvisibility%2Cjoin_mode%2Cacademy_id%2Cacademies%28name%2Ccity%2Cstate%29&status=eq\.active&visibility=eq\.listed&order=end_date\.asc\.nullslast$" 1;
  "~^GET:/supabase/rest/v1/class_departments\?select=id%2Cclass_id%2Cname&class_id=eq\.[0-9a-fA-F-]{36}&order=name\.asc$" 1;
  "~^POST:/supabase/rest/v1/rpc/lookup_class_invite$" 1;
}

resolver 127.0.0.11 valid=10s ipv6=off;
upstream dev_web { zone dev_web 64k; server web:8789 resolve; }
upstream dev_api { zone dev_api 64k; server gateway:80 resolve; }

server {
  listen 80;
  server_name dev.180.academy;
  client_max_body_size 10m;
  add_header X-Robots-Tag "noindex, nofollow" always;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  # Validate the bearer against the isolated Auth service. No locally decoded
  # JWT claim, API key, or client-supplied identity is accepted as proof.
  location = /__dev_auth {
    internal;
    proxy_pass http://dev_api/auth/v1/user;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }

  location = /supabase/rest/v1/rpc/reset_global_leaderboard_only { return 404; }

  location ^~ /supabase/rest/v1/ {
    error_page 418 = @dev_public_rest;
    if ($dev_public_rest = 1) { return 418; }
    auth_request /__dev_auth;
    proxy_pass http://dev_api/rest/v1/;
  }
  location @dev_public_rest {
    rewrite ^/supabase/(.*)$ /$1 break;
    proxy_pass http://dev_api;
  }

  location ^~ /supabase/auth/v1/admin { return 404; }
  location /supabase/ {
    proxy_pass http://dev_api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $dev_connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location = /api/stripe/webhook { return 404; }
  location = /stripe/webhook { return 404; }
  location = /api/class-requests/notify-discord { return 404; }
  location = /webhooks/source/github/events/manual { return 404; }
  location / {
    proxy_pass http://dev_web;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
